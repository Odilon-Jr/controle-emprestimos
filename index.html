<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Empréstimos">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Controle de Empréstimos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="auth-pending">
  <div id="app">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <h5 class="mb-0"><i class="bi bi-bank2 me-2"></i>Empréstimos</h5>
      </div>
      <ul class="nav flex-column sidebar-nav">
        <li class="nav-item">
          <a class="nav-link active" href="#" data-page="dashboard">
            <i class="bi bi-grid-1x2-fill"></i> Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-page="devedores">
            <i class="bi bi-people-fill"></i> Devedores
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-page="emprestimos">
            <i class="bi bi-arrow-left-right"></i> Empréstimos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-page="cobrancas">
            <i class="bi bi-exclamation-triangle-fill"></i> Cobranças
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#" data-page="backup">
            <i class="bi bi-gear-fill"></i> Backup
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main -->
    <main class="main-content">
      <div id="page-dashboard" class="page-content active"></div>
      <div id="page-devedores" class="page-content"></div>
      <div id="page-emprestimos" class="page-content"></div>
      <div id="page-cobrancas" class="page-content"></div>
      <div id="page-backup" class="page-content"></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="appModal" tabindex="-1" aria-labelledby="appModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-fullscreen-sm-down">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="appModalLabel"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="appModalBody"></div>
        <div class="modal-footer" id="appModalFooter"></div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
        <i class="bi bi-info-circle-fill me-2" id="toastIcon"></i>
        <strong class="me-auto" id="toastTitle">Notificação</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Fechar"></button>
      </div>
      <div class="toast-body" id="toastBody"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
  <script>
    // Service worker: só funciona em http(s) — em file:// o app abre sem cache offline.
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((err) => {
          console.warn('Service worker não registrado:', err);
        });
      });
    }
  </script>
</body>
</html>
